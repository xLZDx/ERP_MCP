name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: business_ai
          POSTGRES_USER: business_ai
          POSTGRES_PASSWORD: business_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U business_ai"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: bandit -q -r src
      - run: python -m compileall -q src scripts testbed
      - run: python scripts/migrate.py
        env:
          BAG_DATABASE_URL: postgresql://business_ai:business_ai@localhost:5432/business_ai
      - run: pytest
      - run: pip-audit
