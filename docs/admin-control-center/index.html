.main{min-width:0}.topbar{height:66px;position:sticky;top:0;z-index:4;background:#0e1419ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 31px}
.crumb{color:#81909b;font-size:12px}.crumb b{color:#e8eef1}

.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:15px}.metric,.card{border:1px solid var(--line);background:var(--panel);border-radius:var(--r)}.metric{padding:15px}.metric label{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:26px;line-height:1;margin:8px 0 6px;letter-spacing:-.04em}.metric small{color:#9eabb4}.metric small.good{color:#9ce8d8}.metric small.warn{color:#ecc47f}
.card{overflow:hidden}.card-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.card-head h2{margin:0;font-size:13px}.card-head p{margin:2px 0 0;color:var(--muted);font-size:11px}
.toolbar{display:flex;gap:8px;align-items:center}.search,.field input,.field select,.field textarea{background:#0e151a;border:1px solid #35424c;color:var(--text);border-radius:7px;padding:8px 9px;outline:none}.search{min-width:220px}.search:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#55bba5;box-shadow:0 0 0 2px #55bba522}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px}th{padding:11px 15px;text-align:left;background:#172028;color:#788792;text-transform:uppercase;font-size:9px;letter-spacing:.09em}td{padding:12px 15px;border-top:1px solid #222c34;color:#dbe3e7;font-size:12px;vertical-align:middle}tbody tr:hover td{background:#182129}

.tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);padding:0 15px}.tab{border:0;background:transparent;color:#8c99a3;padding:11px 9px;border-bottom:2px solid transparent;white-space:nowrap}.tab.active{color:#a4ecdd;border-bottom-color:var(--teal)}
.detail-shell{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.detail{border:1px solid #27333b;background:#10171d;border-radius:8px;padding:10px}.detail label{display:block;color:#74828c;text-transform:uppercase;letter-spacing:.08em;font-size:9px}.detail strong{display:block;margin-top:4px;font-size:11px;word-break:break-word}
.health-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:15px}.health-card{border:1px solid var(--line);background:#10171d;border-radius:8px;padding:12px}.health-card label{display:block;color:#7b8993;font-size:10px}.health-card strong{display:block;font-size:15px;margin:4px 0}.health-card small{color:#8f9da7}
.matrix{overflow:auto}.matrix table{min-width:1120px}.matrix th:not(:first-child),.matrix td:not(:first-child){text-align:center}.cell{display:inline-flex;min-width:72px;justify-content:center;border-radius:7px;padding:5px 7px;font-size:10px}.cell.allow{background:#1e352f;color:#9ce9d8}.cell.deny{background:#392226;color:#f0a2a6}.cell.inherit{background:#202c37;color:#aac9ee}.cell.none{background:#22282e;color:#7d8991}.cell.unsupported{border:1px dashed #5b4830;color:#ddb982}
.role-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}.role-list{display:grid;gap:6px;padding:10px}.role-item{border:1px solid transparent;background:#11181e;color:#b9c4ca;border-radius:8px;padding:10px;text-align:left}.role-item:hover{border-color:#33424c}.role-item.active{border-color:#39695e;background:#19302b;color:#a5ecdc}.role-item strong{display:block;font-size:12px}.role-item small{color:#788791}
.cap-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:15px}.cap-row{display:flex;align-items:flex-start;gap:9px;border:1px solid #27323b;background:#10171c;border-radius:8px;padding:10px}.cap-row input{margin-top:2px}.cap-row b{font-size:11px;display:block}.cap-row small{display:block;color:#788791;margin-top:2px}
.drawer-back{position:fixed;inset:0;background:#03060888;z-index:10}.drawer{position:absolute;top:0;right:0;width:min(520px,94vw);height:100%;background:#11181e;border-left:1px solid #35424d;box-shadow:var(--shadow);display:flex;flex-direction:column}.drawer-h{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.drawer-h h2{font-size:17px;margin:2px 0}.drawer-body{padding:16px 18px;overflow:auto;display:grid;gap:14px}.drawer-f{margin-top:auto;border-top:1px solid var(--line);padding:13px 18px;display:flex;justify-content:flex-end;gap:8px;background:#10171d}.x{border:0;background:transparent;color:#a8b4bb;font-size:21px}
.modal-back{position:fixed;inset:0;background:#030608cc;z-index:20;display:grid;place-items:center;padding:16px}.modal{width:min(760px,97vw);max-height:94vh;overflow:auto;background:#131a20;border:1px solid #37454f;border-radius:14px;box-shadow:var(--shadow)}.modal-h,.modal-f{padding:15px 18px;display:flex;justify-content:space-between;gap:10px;align-items:center}.modal-h{border-bottom:1px solid var(--line)}.modal-f{border-top:1px solid var(--line);justify-content:flex-end;position:sticky;bottom:0;background:#131a20}.modal h2{margin:0;font-size:17px}.wizard{padding:16px 18px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:17px}.step{font-size:10px;color:#687681;border-top:3px solid #27323b;padding-top:6px}.step.active{border-color:var(--teal);color:#a7eadc}.step.done{border-color:#477d70;color:#8fbaaf}.form{display:grid;gap:12px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:#b7c2c8;font-size:11px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.field small{display:block;color:#75838d;font-size:10px;margin-top:4px}.check{display:flex;gap:8px;align-items:flex-start;color:#c5ced3;font-size:11px}.probe{border:1px solid #315448;background:#14241f;border-radius:9px;padding:12px}.probe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.probe-item{background:#0e1714;border:1px solid #244339;border-radius:7px;padding:9px}.probe-item label{display:block;font-size:9px;color:#72a697;text-transform:uppercase}.probe-item strong{display:block;font-size:11px;margin-top:3px}
.company-pick{display:grid;gap:7px}.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #293640;background:#11191f;border-radius:8px;padding:9px}.pick-main{display:flex;gap:9px;align-items:center}.pick small{color:#74828d}
.toast{position:fixed;right:20px;bottom:20px;z-index:30;border:1px solid #3b7868;background:#213a34;color:#c0f2e6;border-radius:9px;padding:10px 13px;box-shadow:0 10px 34px #0008;font-size:11px}
.mini-filter{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.select-mini{border:1px solid var(--line);background:#131b21;color:#b8c3c9;border-radius:7px;padding:6px 8px;font-size:11px}
.progress{height:6px;border-radius:99px;background:#202a31;overflow:hidden}.progress i{display:block;height:100%;background:var(--teal);width:72%}
@media(max-width:1150px){.detail-shell{grid-template-columns:1fr}.role-layout{grid-template-columns:1fr}.role-list{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){.app{grid-template-columns:70px 1fr}.side{align-items:center;padding:18px 8px}.brand>div:last-child,.nav-label,.nav .label,.side-foot p,.health span:last-child{display:none}.nav button{width:48px;justify-content:center}.content{padding:23px 18px}.topbar{padding:0 19px}.grid4{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}
@media(max-width:680px){.content{padding:17px 11px}.topbar{padding:0 12px;height:58px}.page-head{flex-direction:column}.actions{justify-content:flex-start}.grid4{grid-template-columns:1fr 1fr}.row2,.detail-grid,.health-grid,.cap-grid,.probe-grid{grid-template-columns:1fr}.role-list{grid-template-columns:1fr}.search{min-width:0;width:100%}.toolbar{width:100%}.top-actions .chip:not(.demo){display:none}.steps{grid-template-columns:1fr}.step{border-top:0;border-left:3px solid #27323b;padding:4px 0 4px 7px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo">E</div><div><strong>ERP_MCP</strong><small>Admin Control Center</small></div></div>

    <div class="nav-label">Control plane</div>

<script>
const state={

const sources=[

 {id:'northwind-prod',name:'Northwind Holding',status:'Healthy',companies:14,platform:'8.3.25.1546',config:'ERP 2.5',route:'ODATA_JSON_V3',fp:'f92c33…1a8',last:'18 min ago',latency:'221 ms',entitySets:601,drift:'Stable',url:'https://northwind.example/odata/standard.odata',admin:'Global SOURCE_ADMIN'},
 {id:'dacia-retail-1c',name:'Dacia Retail Group',status:'Metadata drift',companies:21,platform:'8.3.26.1427',config:'Retail 2.3',route:'ODATA_JSON_V3',fp:'0d91af…ef7',last:'09:18',latency:'197 ms',entitySets:488,drift:'DRIFTED',url:'https://dacia.example/odata/standard.odata',admin:'Ops Admins'}

 {id:'2f11…a8',name:'Firma Alpha SRL',source:'client-037-1c',sourceName:'Client 037 · Accounting',ref:'0a71-2f…',principals:12,status:'Active',default:true},
 {id:'5b63…42',name:'Firma Beta SRL',source:'client-037-1c',sourceName:'Client 037 · Accounting',ref:'0b29-71…',principals:8,status:'Active'},

 {id:'22ca…90',name:'Dacia Services SRL',source:'dacia-retail-1c',sourceName:'Dacia Retail Group',ref:'77c1-5a…',principals:4,status:'Active'},
 {id:'e183…6d',name:'Northwind Logistics SRL',source:'northwind-prod',sourceName:'Northwind Holding',ref:'4d8c-11…',principals:17,status:'Active'}
];

const identities=[
 {id:'usr_49d2…',name:'Irina Munteanu',kind:'Subject',mail:'irina@company.example',groups:['Accounting Moldova','Finance Reviewers'],platform:['USER'],business:['ACCOUNTANT'],companies:['Firma Alpha SRL','Firma Gamma SRL'],denies:['Firma Beta SRL'],caps:['accounting.read','ar.read','ap.read','inventory.read','month_close.review']},
 {id:'finance-reviewers',name:'Finance Reviewers',kind:'Group',mail:'IdP group',groups:['7 members'],platform:['AUDITOR'],business:['AUDITOR_BUSINESS'],companies:['Firma Alpha SRL','Firma Beta SRL','Firma Gamma SRL','Northwind Logistics SRL'],denies:[],caps:['accounting.read','audit.evidence.read']},
 {id:'accounting-md',name:'Accounting Moldova',kind:'Group',mail:'IdP group',groups:['18 members'],platform:['USER'],business:['ACCOUNTANT'],companies:['Firma Alpha SRL','Firma Beta SRL','Firma Gamma SRL'],denies:[],caps:['accounting.read','ar.read','ap.read','bank.read','cash.read']},
 {id:'erp-mcp-ops',name:'Ops Admins',kind:'Group',mail:'IdP group',groups:['3 members'],platform:['SOURCE_ADMIN'],business:[],companies:[],denies:[],caps:[]}
];

const roleDefs={
 PLATFORM_ADMIN:{desc:'Global control-plane administration, including platform-role assignment.',caps:['admin.read','source.manage','grant.manage','profile.manage','platform_roles.manage','audit.read']},
 SOURCE_ADMIN:{desc:'Register/update assigned sources, run safe probes, refresh capabilities and acknowledge drift.',caps:['admin.read','source.read','source.manage','source.probe','capability.refresh','drift.ack']},
 ACCESS_ADMIN:{desc:'Manage subject/group data access inside the delegated source boundary.',caps:['admin.read','principal.resolve','grant.read','grant.manage','access.preview']},
 PROFILE_ADMIN:{desc:'Manage semantic profile lifecycle and mapping validation.',caps:['admin.read','profile.read','profile.manage','mapping.validate','evidence.read']},
 AUDITOR:{desc:'Read control-plane state and immutable audit only.',caps:['admin.read','source.read','grant.read','profile.read','audit.read']}
};

const pageMeta={
 overview:['Overview','Operate sources, companies, identity-based access and policy from one control center.'],
 sources:['1C sources','Connect secure read-only 1C bases, inspect health, capability evidence and metadata drift.'],
 companies:['Companies','Manage business organizations independently from the technical source that contains them.'],
 identities:['Users & groups','Resolve identities from your OIDC provider and inspect effective roles, access and capabilities.'],
 access:['Access matrix','Review effective company access at scale: direct, inherited, denied or not yet enforceable.'],
 roles:['Roles & capabilities','Keep platform administration separate from business data capabilities.'],
 audit:['Audit & evidence','Trace attributable admin activity, policy changes, conflicts and metadata events.']
};

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function status(s){
 let cls=s==='Metadata drift'||s==='DRIFTED'?'warn':s==='Conflict'||s==='Denied'?'red':s==='Disabled'?'neutral':'';
 let color=cls==='warn'?'var(--amber)':cls==='red'?'var(--red)':cls==='neutral'?'#8e99a1':'var(--green)';
 return '<span class="status '+cls+'"><i class="dot" style="background:'+color+'"></i>'+esc(s)+'</span>'
}
function tag(t,c=''){return '<span class="tag '+c+'">'+esc(t)+'</span>'}
function pageHead(actions=''){
 const m=pageMeta[state.page];
 return '<div class="page-head"><div><div class="eyebrow">Administration / '+m[0]+'</div><h1>'+m[0]+'</h1><p>'+m[1]+'</p></div><div class="actions">'+actions+'</div></div>'
}
function sourceRows(){
 return sources.map(s=>'<tr data-source="'+s.id+'"><td><div class="entity"><div class="iconbox">'+esc(s.name.split(' ')[0].slice(0,2).toUpperCase())+'</div><div><b>'+esc(s.name)+'</b><span class="sub">'+esc(s.id)+'</span></div></div></td><td>'+status(s.status)+'</td><td>'+s.companies+'</td><td>'+esc(s.platform)+'</td><td>'+esc(s.route)+'</td><td>'+esc(s.last)+'</td><td><button class="kebab" onclick="openSourceDetail(\''+s.id+'\')">⋯</button></td></tr>').join('')
}
function sourceTable(){
 return '<div class="card"><div class="card-head"><div><h2>Registered sources</h2><p>Only server-registered endpoints can reach a 1C adapter.</p></div><div class="toolbar"><input class="search" placeholder="Search sources…" oninput="filterRows(this,\'sourceTable\')" aria-label="Search sources"></div></div><div class="table-wrap"><table id="sourceTable"><thead><tr><th>Source</th><th>Status</th><th>Companies</th><th>Platform</th><th>Route</th><th>Last check</th><th></th></tr></thead><tbody>'+sourceRows()+'</tbody></table></div><div class="foot"><span>'+sources.length+' demo sources</span><span>Read-only transport · registered IDs only</span></div></div>'

 document.getElementById('overlay').innerHTML='<div class="modal-back"><section class="modal"><div class="modal-h"><div><div class="eyebrow">Access policy</div><h2>Create access grant</h2></div><button class="x" onclick="closeOverlay()">×</button></div><div class="wizard"><div class="form"><div class="row2"><div class="field"><label>Principal kind</label><select><option>Subject</option><option>Group</option></select></div><div class="field"><label>Stable IdP ID</label><input placeholder="user-847293"></div></div><div class="row2"><div class="field"><label>Source</label><select><option>Client 037 · Accounting</option><option>Northwind Holding</option></select></div><div class="field"><label>Company scope</label><select><option>Source-wide</option><option>Firma Alpha SRL</option><option>Firma Beta SRL</option></select></div></div><div class="row2"><div class="field"><label>Effect</label><select><option>Allow</option><option>Deny</option></select></div><div class="field"><label>Expires</label><input placeholder="Optional ISO date/time"></div></div><div class="field"><label>Reason</label><textarea rows="2" placeholder="Required business reason"></textarea></div><div class="banner"><span>!</span><div><b>Impact preview:</b> source-wide and group grants may affect many companies/users. Production requires an explicit preview before confirmation.</div></div></div></div><div class="modal-f"><button class="btn" onclick="closeOverlay()">Cancel</button><button class="btn primary" onclick="toast(\'Impact preview calculated. Demo does not mutate anything.\')">Review impact</button></div></section></div>'
}

const wizardSteps=['Connection','Credentials','Probe','Companies','Review'];
function openWizard(){state.wizardStep=0;drawWizard()}
function drawWizard(){
 let steps=wizardSteps.map((s,i)=>'<div class="step '+(i===state.wizardStep?'active':i<state.wizardStep?'done':'')+'">'+(i+1)+'. '+s+'</div>').join('');
 let body='';
 if(state.wizardStep===0) body='<div class="form"><div class="row2"><div class="field"><label>Source ID</label><input value="client-042-1c"></div><div class="field"><label>Display name</label><input value="Client 042 · Accounting"></div></div><div class="field"><label>1C OData endpoint</label><input value="https://1c.client042.example/odata/standard.odata"><small>No URL is ever passed directly to the runtime adapter before server-side egress validation.</small></div><div class="row2"><div class="field"><label>Project</label><select><option>1C</option></select></div><div class="field"><label>Platform hint</label><input placeholder="Optional · e.g. 8.3.27"></div></div></div>';
 if(state.wizardStep===1) body='<div class="form"><div class="banner info"><span>🔐</span><div><b>Secret references only.</b> The browser never accepts or displays the actual 1C password in this design.</div></div><div class="row2"><div class="field"><label>Username secret reference</label><input value="onec/client-042/username"></div><div class="field"><label>Password secret reference</label><input value="onec/client-042/password"></div></div><label class="check"><input type="checkbox" checked disabled> Source will be registered with read_only=true.</label><label class="check"><input type="checkbox" checked> Test secret refs during safe probe.</label></div>';
 if(state.wizardStep===2) body='<div class="form"><div class="probe"><b style="color:#a5ead9">✓ Safe probe passed</b><div class="probe-grid"><div class="probe-item"><label>HTTP</label><strong>200 OK</strong></div><div class="probe-item"><label>Latency</label><strong>176 ms</strong></div><div class="probe-item"><label>Route</label><strong>ODATA_JSON_V3</strong></div><div class="probe-item"><label>Platform</label><strong>8.3.27.1688</strong></div><div class="probe-item"><label>EntitySets</label><strong>429</strong></div><div class="probe-item"><label>Fingerprint</label><strong>8f93…aa7</strong></div></div></div><div class="banner good"><span>✓</span><div>Redirects disabled · destination approved · GET/HEAD only · response bounded · credentials resolved server-side.</div></div></div>';
 if(state.wizardStep===3) body='<div class="form"><div class="banner"><span>!</span><div>Detected organizations are <b>candidates</b>, not authoritative until reviewed. Custom 1C configurations can use different catalogs.</div></div><div class="company-pick"><label class="pick"><span class="pick-main"><input type="checkbox" checked><span><b>Firma Delta SRL</b><small>external_ref · b811…c4</small></span></span>'+tag('Candidate','blue')+'</label><label class="pick"><span class="pick-main"><input type="checkbox" checked><span><b>Firma Epsilon SRL</b><small>external_ref · b81f…98</small></span></span>'+tag('Candidate','blue')+'</label><label class="pick"><span class="pick-main"><input type="checkbox"><span><b>Demo Organization</b><small>external_ref · demo…01</small></span></span>'+tag('Skip','disabled')+'</label></div></div>';
 if(state.wizardStep===4) body='<div class="form"><div class="detail-grid"><div class="detail"><label>Source</label><strong>client-042-1c</strong></div><div class="detail"><label>Endpoint</label><strong>Approved HTTPS endpoint</strong></div><div class="detail"><label>Secrets</label><strong>2 server-side refs</strong></div><div class="detail"><label>Companies</label><strong>2 selected candidates</strong></div><div class="detail"><label>Read-only</label><strong>true</strong></div><div class="detail"><label>Metadata fingerprint</label><strong>8f93…aa7</strong></div></div><div class="banner info"><span>ⓘ</span><div>Production commit will record actor, reason, request ID, idempotency key and audit outcome. This demo performs no mutation.</div></div></div>';
 let prev=state.wizardStep>0?'<button class="btn" onclick="wizardPrev()">Back</button>':'<button class="btn" onclick="closeOverlay()">Cancel</button>';
 let next=state.wizardStep<wizardSteps.length-1?'<button class="btn primary" onclick="wizardNext()">'+(state.wizardStep===1?'Test & continue':'Continue')+'</button>':'<button class="btn primary" onclick="closeOverlay();toast(\'Demo complete — source would be registered through audited /admin/v1 commands.\')">Register source</button>';
 document.getElementById('overlay').innerHTML='<div class="modal-back"><section class="modal"><div class="modal-h"><div><div class="eyebrow">Source onboarding wizard</div><h2>Connect a 1C source</h2></div><button class="x" onclick="closeOverlay()">×</button></div><div class="wizard"><div class="steps">'+steps+'</div>'+body+'</div><div class="modal-f">'+prev+next+'</div></section></div>'
}
function wizardNext(){if(state.wizardStep<wizardSteps.length-1){state.wizardStep++;drawWizard()}}
function wizardPrev(){if(state.wizardStep>0){state.wizardStep--;drawWizard()}}

render();
</script>
