210px}.search:focus,input:focus,select:focus{border-color:#56bda7;box-shadow:0 0 0 2px #56bda722}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:#7e8c96;text-align:left;background:#171e24;padding:11px 15px}td{padding:12px 15px;border-top:1px solid #242d35;color:#dce3e7;font-size:12px;vertical-align:middle}tr:hover td{background:#182027}.entity{display:flex;gap:9px;align-items:center}.avatar2{width:31px;height:31px;border-radius:8px;background:#23322f;display:grid;place-items:center;color:#a6ecde;font-size:10px;font-weight:800}.sub{color:#7f8d98;font-size:10px;display:block;margin-top:2px}.status{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 7px;font-size:10px;background:#21312d;color:#9ce5d5}.status.warn{background:#33291d;color:#efc376}.status.off{background:#2a2d31;color:#aab2b8}.status.red{background:#382124;color:#ef9fa2}.kebab{background:transparent;border:0;color:#aeb7bd;font-size:18px;cursor:pointer}.foot{padding:10px 15px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#7e8b95;font-size:10px}.split{display:grid;grid-template-columns:1.4fr .6fr;gap:14px;margin-top:14px}.activity{padding:4px 15px}.activity-row{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #242d35;font-size:11px;color:#cdd5da}.activity-row:last-child{border-bottom:0}.activity-row time{display:block;color:#74818c;font-size:10px;margin-top:2px}.mini-dot{width:7px;height:7px;background:var(--teal);border-radius:50%;margin-top:4px;flex:none}.tag{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:#bfc8cf;background:#1b2329;display:inline-block;margin:1px}.tag.allow{background:#20322e;color:#9ee9d9}.tag.deny{background:#352124;color:#efa2a6}.tag.disabled{color:#7d8992}.matrix{overflow:auto}.matrix table{min-width:880px}.matrix th:not(:first-child),.matrix td:not(:first-child){text-ali grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:#b8c2c9;font-size:11px;margin-bottom:5px}.field input,.field select{width:100%;background:#0f1418;color:#edf2f5;border:1px solid #35404a;border-radius:7px;padding:8px 9px;outline:none}.field small{display:block;color:#7d8a94;font-size:10px;margin-top:4px}.check{display:flex;gap:8px;align-items:flex-start;font-size:11px;color:#c7d0d5}.toast{position:fixed;right:20px;bottom:20px;background:#213a34;border:1px solid #397766;color:#c2f2e7;padding:10px 13px;border-radius:8px;z-index:20;font-size:11px;box-shadow:0 10px 32px #0007}

<div class="app">

<script>
const data={
 sources:[
  {id:'client-037-1c',name:'Client 037 · Accounting',status:'Healthy',companies:3,version:'8.3.27',fp:'6e01…bd2',updated:'2 min ago'},
  {id:'northwind-prod',name:'Northwind Holding',status:'Healthy',companies:14,version:'8.3.25',fp:'f92c…1a8',updated:'18 min ago'},
  {id:'dacia-retail-1c',name:'Dacia Retail Group',status:'Metadata drift',companies:21,version:'8.3.26',fp:'0d91…ef7',updated:'09:18'}
 ],
 companies:[
  {id:'2f11…a8',name:'Firma Alpha SRL',source:'Client 037 · Accounting',ref:'0a71…',principals:12,state:'Active'},
  {id:'5b63…42',name:'Firma Beta SRL',source:'Client 037 · Accounting',ref:'0b29…',principals:8,state:'Active'},
  {id:'72ad…17',name:'Firma Gamma SRL',source:'Client 037 · Accounting',ref:'0c02…',principals:5,state:'Active'},
  {id:'22ca…90',name:'Dacia Services SRL',source:'Dacia Retail Group',ref:'77c1…',principals:4,state:'Active'}
 ],
 identities:[
  {name:'Irina Munteanu',kind:'Subject',id:'usr_49d2…',groups:'Accounting, Moldova',platform:'USER',access:'3 companies'},
  {name:'Finance Reviewers',kind:'Group',id:'finance-reviewers',groups:'7 members',platform:'AUDITOR',access:'12 companies'},
  {name:'Accounting Moldova',kind:'Group',id:'accounting-md',groups:'18 members',platform:'USER',access:'27 companies'},
  {name:'Ops Admins',kind:'Group',id:'erp-mcp-ops',groups:'3 members',platform:'SOURCE_ADMIN',access:'2 sources'}
 ]
};
const pageMeta={
 overview:['Overview','Operate sources, companies, identity-based access and policy from one control center.'],
 sources:['1C sources','Register secure read-only 1C connections, inspect capability evidence and metadata drift.'],
 companies:['Companies','Keep business organizations separate from technical 1C sources and review their access boundaries.'],
 identities:['Users & groups','Identity remains owned by OIDC/IdP; ERP_MCP stores stable principal references and policy only.'],
 access:['Access matrix','See effective source/company allow, deny and inheritance without confusing policy with data-plane enforcement.'],
 roles:['Roles & capabilities','Separate platform administration from business capabilities. Unsupported enforcement stays disabled.'],
 audit:['Audit','Trace administrative actions with actor, reason, request ID and immutable evidence.']
};
let page='overview';
function badge(status){const cls=status==='Metadata drift'?'warn':status==='Denied'?'red':status==='Disabled'?'off':'';return '<span class="status '+cls+'"><i class="dot" style="background:'+(cls==='warn'?'var(--amber)':cls==='red'?'var(--red)':'var(--green)')+'"></i>'+status+'</span>'}
function shell(inner,actions=''){const m=pageMeta[page];return '<div class="head"><div><div class="eyebrow">Administration / '+m[0]+'</div><h1>'+m[0]+'</h1><p>'+m[1]+'</p></div><div class="actions">'+actions+'</div></div>'+inner}
function overview(){
 return shell(
 '<div class="banner"><span>ⓘ</span><div><b>Design truth:</b> company grants already exist, but generic <code>onec_read</code> is source-scoped. Company-only policy must not be presented as enforced data isolation until a company-aware tool/adapter path is proven.</div></div>'+
 '<div class="grid4"><div class="metric"><span>1C sources</span><strong>12</strong><em class="good">11 healthy</em></div><div class="metric"><span>Registered companies</span><strong>148</strong><em>source ≠ company</em></div><div class="metric"><span>Active principals</span><strong>86</strong><em>subjects + groups</em></div><div class="metric"><span>Access changes · 7d</span><strong>23</strong><em class="good">audit required</em></div></div>'+
 sourceCard()+
 '<div class="split"><div class="card"><div class="card-head"><div><h2>Recent administration activity</h2><p>Mock events showing required audit shape.</p></div></div><div class="activity"><div class="activity-row"><i class="mini-dot"></i><div>Irina M. revoked grant <b>gr_7a2…</b> for Firma Beta<time>Today 10:42 · actor + reason + request ID</time></div></div><div class="activity-row"><i class="mini-dot" style="background:var(--amber)"></i><div>Metadata drift detected in <b>Client 037</b><time>Today 09:18 · fingerprint changed</time></div></div><div class="activity-row"><i class="mini-dot"></i><div>Finance Reviewers received read access to <b>Northwind Holding</b><time>Yesterday 16:06 · group grant</time></div></div></div></div><div class="card"><div class="card-head"><div><h2>Security boundary</h2><p>What the web layer must never bypass.</p></div></div><div class="activity"><div class="activity-row"><span class="tag allow">IDP</span><div>No local passwords. Users/groups resolve from OIDC provider.</div></div><div class="activity-row"><span class="tag allow">ACL</span><div>Deny before adapter execution; capability never widens data scope.</div></div><div class="activity-row"><span class="tag allow">SECRETS</span><div>Only secret refs cross the admin API. Secret values never reach browser.</div></div></div></div></div>',
 '<button class="btn" onclick="toast(\'Open implementation contract: /admin/v1 + BFF + C3 gates.\')">Architecture</button><button class="btn primary" onclick="openSource()">＋ Connect 1C source</button>'
 )}
function sourceCard(){
 const rows=data.sources.map(s=>'<tr><td><div class="entity"><div class="avatar2">'+s.name.split(' ')[0].slice(0,2).toUpperCase()+'</div><div>'+s.name+'<span class="sub">'+s.id+'</span></div></div></td><td>'+badge(s.status)+'</td><td>'+s.companies+'</td><td>'+s.version+'</td><td>'+s.fp+'</td><td>'+s.updated+'</td><td><button class="kebab" onclick="toast(\'Source detail: health, capabilities, drift, companies, grants, audit.\')">⋯</button></td></tr>').join('');
 return '<div class="card"><div class="card-head"><div><h2>Sources</h2><p>Registered endpoints only · read-only transport</p></div><div class="toolbar"><input class="search" placeholder="Search sources…" aria-label="Search sources"></div></div><div class="table-wrap"><table><thead><tr><th>Source</th><th>Status</th><th>Companies</th><th>Platform</th><th>Metadata FP</th><th>Updated</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="foot"><span>3 demo rows</span><span>No live systems connected</span></div></div>'
}
function sources(){
 return shell(
 '<div class="banner info"><span>↳</span><div><b>Source onboarding:</b> browser submits endpoint candidate + secret references. A server-side probe validates egress policy, disables redirects, resolves secrets internally and performs GET/HEAD-only checks.</div></div>'+sourceCard()+
 '<div class="section-title"><div><h2>Selected source · Client 037</h2><p>Example detail model for implementation.</p></div></div><div class="detail-grid"><div class="detail"><label>Endpoint</label><strong>https://1c.example/odata/standard.odata</strong></div><div class="detail"><label>Credentials</label><strong>secret refs only · onec/client-037/…</strong></div><div class="detail"><label>Capability route</label><strong>ODATA_JSON_V3 · metadata acknowledged</strong></div><div class="detail"><label>Administrative boundary</label><strong>Ops Admins · SOURCE_ADMIN</strong></div></div>',
 '<button class="btn" onclick="toast(\'Capability refresh must be source-authorized and audited.\')">Refresh capability</button><button class="btn primary" onclick="openSource()">＋ Connect source</button>'
 )}
function companies(){
 const rows=data.companies.map(c=>'<tr><td><div class="entity"><div class="avatar2">'+c.name[6]+'</div><div>'+c.name+'<span class="sub">'+c.id+'</span></div></div></td><td>'+c.source+'</td><td>'+c.ref+'</td><td>'+badge(c.state)+'</td><td>'+c.principals+'</td><td><button class="kebab" onclick="toast(\'Company detail keeps stable source_id + external_ref.\')">⋯</button></td></tr>').join('');
 return shell(
 '<div class="banner"><span>!</span><div><b>One 1C source can contain many companies.</b> Company records use a stable external_ref within the source. Discovery is advisory because custom configurations may not expose a universally identifiable Organizations catalog.</div></div><div class="card"><div class="card-head"><div><h2>Registered companies</h2><p>Manual registration is always available; discovered candidates require review.</p></div><div class="toolbar"><input class="search" placeholder="Filter by source/company…" aria-label="Filter companies"></div></div><div class="table-wrap"><table><thead><tr><th>Company</th><th>Source</th><th>External ref</th><th>Status</th><th>Principals</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>',
 '<button class="btn" onclick="toast(\'Discovery suggestions never auto-create authoritative companies.\')">Review candidates</button><button class="btn primary" onclick="toast(\'Manual company registration flow: source + external_ref + display name.\')">＋ Register company</button>'
 )}
function identities(){
 const rows=data.identities.map(i=>'<tr><td><div class="entity"><div class="avatar2">'+i.name.split(' ').map(x=>x[0]).slice(0,2).join('')+'</div><div>'+i.name+'<span class="sub">'+i.id+'</span></div></div></td><td>'+i.kind+'</td><td>'+i.groups+'</td><td><span class="tag">'+i.platform+'</span></td><td>'+i.access+'</td><td><button class="kebab" onclick="toast(\'Show effective grants, roles, inheritance and denies.\')">⋯</button></td></tr>').join('');
 return shell(
 '<div class="banner info"><span>ⓘ</span><div><b>No local users.</b> With a configured directory provider the server can search stable IdP identities; otherwise exact subject/group ID entry remains available. Passwords never live in ERP_MCP.</div></div><div class="card"><div class="card-head"><div><h2>Identity references</h2><p>Display aliases are convenience; stable IdP IDs are authoritative.</p></div><div class="toolbar"><input class="search" placeholder="Resolve user or group…" aria-label="Resolve user or group"></div></div><div class="table-wrap"><table><thead><tr><th>Principal</th><th>Kind</th><th>Directory</th><th>Platform role</th><th>Data scope</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>',
 '<button class="btn" onclick="toast(\'Directory resolver is optional and server-side.\')">IdP settings</button><button class="btn primary" onclick="openGrant()">＋ Assign access</button>'
 )}
function access(){
 const cell=(t,c)=>'<span class="cell '+c+'">'+t+'</span>';
 return shell(
 '<div class="banner"><span>!</span><div><b>Effective access is policy, not a promise of every data operation.</b> "Unsupported" means company policy exists but the current generic data plane cannot enforce that company boundary.</div></div><div class="card matrix"><div class="card-head"><div><h2>Effective company access</h2><p>Deny overrides allow. Inherited means group-derived.</p></div><div class="toolbar"><input class="search" placeholder="Find principal…" aria-label="Find principal"></div></div><div class="table-wrap"><table><thead><tr><th>Principal</th><th>Alpha</th><th>Beta</th><th>Gamma</th><th>Northwind</th><th>Dacia Services</th></tr></thead><tbody>'+
 '<tr><td><b>Irina Munteanu</b><span class="sub">subject · usr_49d2…</span></td><td>'+cell('Allow','allow')+'</td><td>'+cell('Deny','deny')+'</td><td>'+cell('Inherited','inherit')+'</td><td>'+cell('None','none')+'</td><td>'+cell('Unsupported','unsupported')+'</td></tr>'+
 '<tr><td><b>Finance Reviewers</b><span class="sub">group</span></td><td>'+cell('Allow','allow')+'</td><td>'+cell('Allow','allow')+'</td><td>'+cell('Allow','allow')+'</td><td>'+cell('Allow','allow')+'</td><td>'+cell('None','none')+'</td></tr>'+
 '<tr><td><b>Accounting Moldova</b><span class="sub">group</span></td><td>'+cell('Allow','allow')+'</td><td>'+cell('Allow','allow')+'</td><td>'+cell('Allow','allow')+'</td><td>'+cell('None','none')+'</td><td>'+cell('Allow','allow')+'</td></tr>'+
 '</tbody></table></div><div class="foot"><span>Impact preview required before broad/group grants</span><span>Exact grant-id revoke only</span></div></div>',
 '<button class="btn" onclick="toast(\'Filters: source, company, principal kind, effect, expiry, direct/inherited.\')">Filters</button><button class="btn primary" onclick="openGrant()">＋ Create grant</button>'

function roles(){
 const role=(name,desc,caps,enabled)=>'<div class="role-card"><h3>'+name+'</h3><p>'+desc+'</p><div class="caps">'+caps.map(c=>'<span class="tag '+(enabled?'allow':'disabled')+'">'+c+'</span>').join('')+'</div><footer>'+(enabled?'Template design · enable only with server enforcement':'Disabled until server enforcement exists')+'</footer></div>';
 return shell(
 '<div class="banner danger"><span>⛔</span><div><b>Capability enforcement is not in the current baseline.</b> These controls remain disabled until every protected operation checks the capability server-side and the full authorization matrix passes.</div></div>'+
 '<div class="section-title"><div><h2>Platform administration roles</h2><p>Who can administer the system. Separate from business roles.</p></div></div><div class="role-grid">'+
 role('PLATFORM_ADMIN','Global control-plane administration.',['roles','sources','access','profiles'],true)+
 role('SOURCE_ADMIN','Register/update delegated sources and capability state.',['source.manage','drift.ack'],true)+
 role('ACCESS_ADMIN','Manage source/company grants inside delegated boundary.',['grant.manage','principal.resolve'],true)+
 role('PROFILE_ADMIN','Manage semantic profile lifecycle and evidence.',['profile.manage','mapping.validate'],true)+
 role('AUDITOR','Read configuration and immutable audit only.',['admin.read','audit.read'],true)+
 '</div><div class="section-title"><div><h2>Business role templates</h2><p>What a user may do with already-authorized data.</p></div></div><div class="role-grid">'+

 '</div>',
 '<button class="btn" onclick="toast(\'Platform role assignment requires step-up auth and audit.\')">Platform roles</button><button class="btn" disabled style="opacity:.45;cursor:not-allowed">Business editor disabled</button>'
 )}

 '<tr><td>10:42:18</td><td>usr_49d2…</td><td>grant.revoke</td><td>gr_7a2… · Firma Beta</td><td>Role changed</td><td>'+badge('Healthy').replace('Healthy','Success')+'</td><td>rq_918…</td></tr>'+

 '<tr><td>09:18:02</td><td>system</td><td>metadata.drift</td><td>dacia-retail-1c</td><td>fingerprint changed</td><td>'+badge('Metadata drift')+'</td><td>rq_861…</td></tr>'+

function render(){document.getElementById('crumb').textContent=pageMeta[page][0];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const views={overview,sources,companies,identities,access,roles,audit};document.getElementById('content').innerHTML=views[page]()}
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(!b)return;page=b.dataset.page;render();window.scrollTo(0,0)};
function openSource(){document.getElementById('modalRoot').innerHTML='<div class="modal-back" id="back"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="sourceTitle"><div class="modal-h"><div><div class="eyebrow">Safe onboarding</div><h2 id="sourceTitle">Connect a 1C source</h2></div><button class="x" onclick="closeModal()" aria-label="Close">×</button></div><div class="form"><div class="row2"><div class="field"><label>Source ID</label><input placeholder="client-037-1c"></div><div class="field"><label>Display name</label><input placeholder="Client 037 · Accounting"></div></div><div class="field"><label>1C service URL</label><input placeholder="https://1c.example/odata/standard.odata"><small>Validated against server-side egress policy. Redirects disabled.</small></div><div class="row2"><div class="field"><label>Username secret ref</label><input placeholder="onec/client-037/username"></div><div class="field"><label>Password secret ref</label><input placeholder="onec/client-037/password"></div></div><label class="check"><input type="checkbox" checked disabled> Production 1C access is read-only. Probe uses GET/HEAD only.</label><div class="banner info" style="margin:0"><span>ⓘ</span><div>Test connection returns safe capability metadata and optional company candidates. It never returns secret values or raw upstream bodies.</div></div></div><div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="closeModal();toast(\'Demo only — source probe requires reviewed /admin/v1 backend.\')">Test connection</button></div></section></div>'}
function openGrant(){document.getElementById('modalRoot').innerHTML='<div class="modal-back" id="back"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="grantTitle"><div class="modal-h"><div><div class="eyebrow">Access policy</div><h2 id="grantTitle">Create access grant</h2></div><button class="x" onclick="closeModal()" aria-label="Close">×</button></div><div class="form"><div class="row2"><div class="field"><label>Principal kind</label><select><option>Subject</option><option>Group</option></select></div><div class="field"><label>Stable IdP ID</label><input placeholder="user-847293"></div></div><div class="row2"><div class="field"><label>Source</label><select><option>Client 037 · Accounting</option><option>Northwind Holding</option></select></div><div class="field"><label>Company scope</label><select><option>Source-wide</option><option>Firma Alpha SRL</option><option>Firma Beta SRL</option></select></div></div><div class="row2"><div class="field"><label>Effect</label><select><option>Allow</option><option>Deny</option></select></div><div class="field"><label>Expires</label><input placeholder="Optional ISO date/time"></div></div><div class="field"><label>Reason</label><input placeholder="Required business reason"></div><div class="banner" style="margin:0"><span>!</span><div>Company-only grants do not authorize generic onec_read. The server will show the exact effective impact before confirmation.</div></div></div><div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="closeModal();toast(\'Demo only — exact grant creation requires admin API + audit/idempotency.\')">Review impact</button></div></section></div>'}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast" role="status">'+msg+'</div>';setTimeout(()=>r.innerHTML='',3200)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
