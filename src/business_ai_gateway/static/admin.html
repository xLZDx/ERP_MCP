<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1015">
<title>ERP_MCP · Admin Control Center</title>
<style>
:root{color-scheme:dark;--bg:#0b1015;--side:#0e141a;--panel:#141b22;--panel2:#10171d;--line:#27323c;--text:#edf3f6;--muted:#8c99a4;--teal:#68dec3;--green:#7be0b9;--amber:#efbd6f;--red:#ef8787;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{position:sticky;top:0;height:100vh;padding:20px 13px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:10px;align-items:center;padding:0 8px}.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,#9bf0dc,#3fa88f);display:grid;place-items:center;color:#08231d;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#a3afb8;text-align:left;padding:10px 11px;border-radius:8px;cursor:pointer}.nav button:hover{background:#192229;color:#fff}.nav button.active{background:#1d3530;color:#a0efdf}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px;color:var(--muted);font-size:11px}.main{min-width:0}.top{height:64px;position:sticky;top:0;z-index:3;background:#0e1419ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:#b8c3c9;font-size:11px}.content{padding:27px 30px 50px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:17px}.head h1{margin:0 0 5px;font-size:26px;letter-spacing:-.03em}.head p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #35424c;background:#1a232a;color:#e6ecef;padding:8px 11px;border-radius:8px;font-weight:650;font-size:12px;cursor:pointer}.btn.primary{background:var(--teal);color:#08231d;border-color:var(--teal)}.btn.danger{background:#2a1d20;color:#f1b0b2;border-color:#553739}.btn:disabled{opacity:.4}.banner{border:1px solid #304a57;background:#15222a;color:#a9cad8;border-radius:10px;padding:12px 14px;margin-bottom:14px}.banner.warn{border-color:#554329;background:#241f17;color:#dcc18d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.metric,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.metric{padding:14px}.metric label{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:25px;margin-top:6px}.card{overflow:hidden}.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}.cardhead h2{font-size:13px;margin:0}.cardhead small{color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{padding:10px 14px;background:#172028;color:#788792;text-transform:uppercase;letter-spacing:.08em;font-size:9px;text-align:left}td{padding:11px 14px;border-top:1px solid #222c34;font-size:12px}tbody tr:hover td{background:#182129}.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:10px;margin:1px;color:#c0cbd1}.tag.ok{background:#1d332d;color:#9de7d6}.tag.warn{background:#362c1e;color:#efc575}.tag.deny{background:#382125;color:#efa3a6}.empty{padding:42px;text-align:center;color:var(--muted)}.loading{padding:42px;text-align:center;color:var(--muted)}.modalback{position:fixed;inset:0;background:#030608cc;display:grid;place-items:center;padding:16px;z-index:10}.modal{width:min(650px,96vw);max-height:92vh;overflow:auto;background:#131a20;border:1px solid #37454f;border-radius:14px}.modalh,.modalf{padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.modalh{border-bottom:1px solid var(--line)}.modalf{border-top:1px solid var(--line);justify-content:flex-end;gap:8px}.form{padding:17px 18px;display:grid;gap:11px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:#b7c2c8;font-size:11px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#0e151a;border:1px solid #35424c;color:var(--text);border-radius:7px;padding:8px 9px}.field small{display:block;color:#75838d;font-size:10px;margin-top:4px}.toast{position:fixed;right:20px;bottom:20px;background:#213a34;border:1px solid #3b7868;color:#c0f2e6;padding:10px 13px;border-radius:9px;z-index:20}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}.error{color:#f2a4a7}.muted{color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:72px 1fr}.brand div:last-child,.nav button span{display:none}.nav button{text-align:center}.content{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.head{flex-direction:column}.row2{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.top{padding:0 12px}}
</style>
</head>
<body>
<div id="root"><div class="loading">Loading Admin Control Center…</div></div>
<div id="overlay"></div><div id="toast"></div>
<script>
const state={me:null,csrf:null,page:'overview'};
const pages={
 overview:['Overview','Live control-plane status and administrative activity.'],
 sources:['1C sources','Registered read-only 1C endpoints and capability health.'],
 companies:['Companies','Business organizations registered inside technical 1C sources.'],
 identities:['Users & groups','Resolve stable IdP subject/group IDs and inspect effective policy.'],
 access:['Access policies','Subject/group grants. Explicit deny overrides allow.'],
 roles:['Roles & capabilities','Platform roles and business capability templates.'],
 profiles:['Semantic profiles','Evidence-backed semantic profile lifecycle.'],
 audit:['Audit & evidence','Immutable runtime and administration evidence.']
};
async function api(path,opts={}){
 const headers={'Accept':'application/json',...(opts.headers||{})};
 if(opts.body){headers['Content-Type']='application/json'}
 if(state.csrf && (opts.method||'GET')!=='GET'){headers['X-CSRF-Token']=state.csrf}
 if((opts.method||'GET')!=='GET' && !headers['Idempotency-Key']){headers['Idempotency-Key']=crypto.randomUUID()}
 const res=await fetch(path,{credentials:'same-origin',...opts,headers});
 let body={};try{body=await res.json()}catch{}
 if(res.status===401){showLogin();throw new Error('AUTH_REQUIRED')}
 if(!res.ok){throw new Error(body.error||('HTTP_'+res.status))}
 return body
}
function showLogin(){
 document.getElementById('root').innerHTML='<div class="login"><div class="loginbox"><div class="logo" style="margin-bottom:16px">E</div><h1>ERP_MCP Admin Control Center</h1><p class="muted">Sign in through your corporate identity provider. ERP_MCP does not store local passwords.</p><a class="btn primary" style="display:inline-block;text-decoration:none;margin-top:10px" href="/admin/login">Sign in with OIDC</a></div></div>'
}
function shell(content,actions=''){
 const p=pages[state.page];
 return '<div class="app"><aside class="side"><div class="brand"><div class="logo">E</div><div><b>ERP_MCP</b><small>Admin Control Center</small></div></div><nav class="nav">'+Object.keys(pages).map(k=>'<button data-page="'+k+'" class="'+(state.page===k?'active':'')+'">◫ <span>'+pages[k][0]+'</span></button>').join('')+'</nav><div class="sidefoot">Authenticated as<br><b>'+esc(state.me.subject)+'</b></div></aside><main class="main"><header class="top"><div>ERP_MCP / <b>'+p[0]+'</b></div><div style="display:flex;gap:8px;align-items:center"><span class="chip">'+state.me.roles.map(r=>r.role).join(', ')+'</span><button class="btn" onclick="logout()">Sign out</button></div></header><section class="content"><div class="head"><div><h1>'+p[0]+'</h1><p>'+p[1]+'</p></div><div class="actions">'+actions+'</div></div>'+content+'</section></main></div>'
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function tag(v,c=''){return '<span class="tag '+c+'">'+esc(v)+'</span>'}
function rows(items,cols){
 if(!items.length)return '<tr><td colspan="'+cols.length+'" class="empty">No records</td></tr>';
 return items.map(x=>'<tr>'+cols.map(c=>'<td>'+c.f(x)+'</td>').join('')+'</tr>').join('')
}
function table(title,items,cols){
 return '<div class="card"><div class="cardhead"><div><h2>'+title+'</h2><small>'+items.length+' records</small></div></div><div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th>'+c.h+'</th>').join('')+'</tr></thead><tbody>'+rows(items,cols)+'</tbody></table></div></div>'
}
async function render(){
 try{
  if(state.page==='overview'){
   const x=await api('/admin/v1/overview');
   document.getElementById('root').innerHTML=shell('<div class="grid"><div class="metric"><label>Sources</label><strong>'+x.sources+'</strong></div><div class="metric"><label>Companies</label><strong>'+x.companies+'</strong></div><div class="metric"><label>Metadata drift</label><strong>'+x.drifted_sources+'</strong></div><div class="metric"><label>Mutations</label><strong>'+(state.me.mutations_enabled?'ON':'OFF')+'</strong></div></div><div class="banner">Live values come from the server. Company-only grants never imply generic OData isolation unless a validated company-scope mapping exists.</div>');
  } else if(state.page==='sources'){
   const x=await api('/admin/v1/sources');
   document.getElementById('root').innerHTML=shell(table('Registered sources',x.items,[{h:'Source',f:i=>'<b>'+esc(i.display_name)+'</b><span class="muted"><br>'+esc(i.source_id)+'</span>'},{h:'Kind',f:i=>esc(i.kind)},{h:'Read-only',f:i=>tag(i.read_only?'Yes':'No',i.read_only?'ok':'deny')},{h:'Enabled',f:i=>tag(i.enabled?'Enabled':'Disabled',i.enabled?'ok':'warn')},{h:'Version',f:i=>esc(i.row_version)}]),'<button class="btn primary" onclick="sourceModal()">＋ Connect source</button>');
  } else if(state.page==='companies'){
   const x=await api('/admin/v1/companies');
   document.getElementById('root').innerHTML=shell(table('Registered companies',x.items,[{h:'Company',f:i=>'<b>'+esc(i.display_name)+'</b><span class="muted"><br>'+esc(i.company_id)+'</span>'},{h:'Source',f:i=>esc(i.source_id)},{h:'External ref',f:i=>esc(i.external_ref)},{h:'State',f:i=>tag(i.enabled?'Active':'Disabled',i.enabled?'ok':'warn')},{h:'Version',f:i=>esc(i.row_version)}]),'<button class="btn primary" onclick="companyModal()">＋ Register company</button>');
  } else if(state.page==='identities'){
   document.getElementById('root').innerHTML=shell('<div class="banner">ERP_MCP does not create users or passwords. Use a stable IdP subject/group ID. Directory search can be added server-side later; exact-ID mode is always explicit.</div><div class="card"><div class="cardhead"><div><h2>Resolve principal</h2><small>Exact-ID fallback</small></div></div><div class="form"><div class="row2"><div class="field"><label>Kind</label><select id="p_kind"><option>subject</option><option>group</option></select></div><div class="field"><label>Stable ID</label><input id="p_id" placeholder="user-847293 or finance-reviewers"></div></div><button class="btn primary" onclick="resolvePrincipal()">Resolve</button><div id="principal_result"></div></div></div>');
  } else if(state.page==='access'){
   const x=await api('/admin/v1/grants');
   document.getElementById('root').innerHTML=shell(table('Access grants',x.items,[{h:'Principal',f:i=>'<b>'+esc(i.principal_id)+'</b><br>'+tag(i.principal_kind)},{h:'Source',f:i=>esc(i.source_id)},{h:'Company',f:i=>esc(i.company_id||'source-wide')},{h:'Effect',f:i=>tag(i.effect,i.effect==='deny'?'deny':'ok')},{h:'Version',f:i=>esc(i.row_version)},{h:'Action',f:i=>i.revoked_at?tag('Revoked','warn'):'<button class="btn danger" onclick="revokeGrant(\''+i.grant_id+'\','+i.row_version+')">Revoke</button>'}]),'<button class="btn primary" onclick="grantModal()">＋ Create grant</button>');
  } else if(state.page==='roles'){
   const r=await api('/admin/v1/business-roles'); const a=await api('/admin/v1/business-role-assignments'); const o=await api('/admin/v1/capability-overrides');
   let p={items:[]}; try{p=await api('/admin/v1/platform-role-bindings')}catch{}
   const body=table('Platform role bindings',p.items,[{h:'Principal',f:i=>esc(i.principal_id)},{h:'Role',f:i=>tag(i.role_name,'ok')},{h:'Source scope',f:i=>esc(i.source_id||'global')},{h:'State',f:i=>i.revoked_at?tag('Revoked','warn'):tag('Active','ok')},{h:'Version',f:i=>esc(i.row_version)}])+'<div style="height:14px"></div>'+table('Business role templates',r.items,[{h:'Role',f:i=>'<b>'+esc(i.display_name)+'</b><br>'+esc(i.role_id)},{h:'Capabilities',f:i=>(i.capabilities||[]).map(x=>tag(x,'ok')).join(' ')},{h:'Policy',f:i=>esc(i.policy_version)}])+'<div style="height:14px"></div>'+table('Assignments',a.items,[{h:'Principal',f:i=>esc(i.principal_id)},{h:'Role',f:i=>esc(i.role_id)},{h:'Source',f:i=>esc(i.source_id)},{h:'Company',f:i=>esc(i.company_id||'all in source')},{h:'State',f:i=>i.revoked_at?tag('Revoked','warn'):tag('Active','ok')}])+'<div style="height:14px"></div>'+table('Capability overrides',o.items,[{h:'Principal',f:i=>esc(i.principal_id)},{h:'Capability',f:i=>esc(i.capability_key)},{h:'Effect',f:i=>tag(i.effect,i.effect==='deny'?'deny':'ok')},{h:'Source',f:i=>esc(i.source_id)}]);
   document.getElementById('root').innerHTML=shell(body);
  } else if(state.page==='profiles'){
   const x=await api('/admin/v1/semantic-profiles');
   document.getElementById('root').innerHTML=shell(table('Semantic profiles',x.items,[{h:'Profile',f:i=>'<b>'+esc(i.profile_name)+'</b><br>'+esc(i.profile_id)},{h:'Source',f:i=>esc(i.source_id)},{h:'Company',f:i=>esc(i.company_id||'source-wide')},{h:'Status',f:i=>tag(i.status,i.status==='VALIDATED'?'ok':i.status==='STALE'?'warn':'')},{h:'Version',f:i=>esc(i.profile_version)}]));
  } else if(state.page==='audit'){
   const x=await api('/admin/v1/audit'); const all=[...(x.admin||[]).map(i=>({...i,stream:'admin'})),...(x.access||[]).map(i=>({...i,stream:'runtime'}))];
   document.getElementById('root').innerHTML=shell(table('Audit events',all,[{h:'Time',f:i=>esc(i.occurred_at)},{h:'Stream',f:i=>tag(i.stream)},{h:'Actor',f:i=>esc(i.actor_subject||i.principal_subject)},{h:'Action',f:i=>esc(i.action||i.tool_name)},{h:'Source',f:i=>esc(i.source_id||'—')},{h:'Outcome',f:i=>tag(i.outcome,i.outcome==='success'?'ok':i.outcome==='denied'?'deny':'warn')}]));
  }
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});
 }catch(e){if(e.message!=='AUTH_REQUIRED')document.getElementById('root').innerHTML='<div class="login"><div class="loginbox"><h2>Unable to load</h2><p class="error">'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">Retry</button></div></div>'}
}
async function resolvePrincipal(){const out=document.getElementById('principal_result');out.innerHTML='<p class="muted">Resolving?</p>';try{const x=await api('/admin/v1/principals/resolve?kind='+encodeURIComponent(val('p_kind'))+'&id='+encodeURIComponent(val('p_id')));out.innerHTML='<div class="banner" style="margin-top:12px"><b>'+esc(x.principal_kind)+' ? '+esc(x.principal_id)+'</b><br>Directory: '+esc(x.directory_status)+'<br>Platform roles: '+(x.platform_roles||[]).map(i=>tag(i.role_name,'ok')).join(' ')+'<br>Grants: '+(x.grants||[]).length+' ? Business assignments: '+(x.business_role_assignments||[]).length+' ? Capability overrides: '+(x.capability_overrides||[]).length+'</div>'}catch(e){out.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
function modal(title,body,submit){document.getElementById('overlay').innerHTML='<div class="modalback"><section class="modal"><div class="modalh"><h2>'+title+'</h2><button class="btn" onclick="closeModal()">×</button></div><div class="form">'+body+'</div><div class="modalf"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="'+submit+'">Submit</button></div></section></div>'}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function val(id){return document.getElementById(id).value.trim()}
function sourceModal(){modal('Connect 1C source','<div class="row2"><div class="field"><label>Source ID</label><input id="s_id"></div><div class="field"><label>Display name</label><input id="s_name"></div></div><div class="field"><label>OData URL</label><input id="s_url"><small>Must pass server-side egress policy.</small></div><div class="row2"><div class="field"><label>Username secret ref</label><input id="s_user"></div><div class="field"><label>Password secret ref</label><input id="s_pass"></div></div><div class="field"><label>Reason</label><textarea id="s_reason"></textarea></div>','createSource()')}
async function createSource(){try{await api('/admin/v1/sources',{method:'POST',body:JSON.stringify({source_id:val('s_id'),display_name:val('s_name'),base_url:val('s_url'),username_secret_ref:val('s_user'),password_secret_ref:val('s_pass'),tags:[],reason:val('s_reason')})});closeModal();toast('Source registered');render()}catch(e){toast(e.message,true)}}
function companyModal(){modal('Register company','<div class="field"><label>Source ID</label><input id="c_source"></div><div class="field"><label>External reference</label><input id="c_ref"></div><div class="field"><label>Display name</label><input id="c_name"></div><div class="field"><label>Reason</label><textarea id="c_reason"></textarea></div>','createCompany()')}
async function createCompany(){try{await api('/admin/v1/companies',{method:'POST',body:JSON.stringify({source_id:val('c_source'),external_ref:val('c_ref'),display_name:val('c_name'),reason:val('c_reason')})});closeModal();toast('Company registered');render()}catch(e){toast(e.message,true)}}
function grantModal(){modal('Create access grant','<div class="row2"><div class="field"><label>Principal kind</label><select id="g_kind"><option>subject</option><option>group</option></select></div><div class="field"><label>Principal ID</label><input id="g_principal"></div></div><div class="row2"><div class="field"><label>Source ID</label><input id="g_source"></div><div class="field"><label>Company UUID (optional)</label><input id="g_company"></div></div><div class="field"><label>Effect</label><select id="g_effect"><option>allow</option><option>deny</option></select></div><div class="field"><label>Reason</label><textarea id="g_reason"></textarea></div>','createGrant()')}
async function createGrant(){try{await api('/admin/v1/grants',{method:'POST',body:JSON.stringify({principal_kind:val('g_kind'),principal_id:val('g_principal'),source_id:val('g_source'),company_id:val('g_company')||null,effect:val('g_effect'),reason:val('g_reason')})});closeModal();toast('Grant created');render()}catch(e){toast(e.message,true)}}
async function revokeGrant(id,version){const reason=prompt('Reason for revoke:');if(!reason)return;try{await api('/admin/v1/grants/'+encodeURIComponent(id)+'/revoke',{method:'POST',body:JSON.stringify({expected_version:version,reason})});toast('Grant revoked');render()}catch(e){toast(e.message,true)}}
async function logout(){try{await api('/admin/logout',{method:'POST'});location.href='/admin/'}catch{location.href='/admin/'}}
function toast(msg,bad=false){document.getElementById('toast').innerHTML='<div class="toast" style="'+(bad?'border-color:#82474a;background:#3a2023;color:#ffc0c0':'')+'">'+esc(msg)+'</div>';setTimeout(()=>document.getElementById('toast').innerHTML='',3000)}
(async()=>{try{state.me=await api('/admin/v1/me');state.csrf=state.me.csrf_token;await render()}catch(e){if(e.message!=='AUTH_REQUIRED')showLogin()}})();
</script>
</body>
</html>
