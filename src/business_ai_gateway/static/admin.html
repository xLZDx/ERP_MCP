<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1015">
<title>ERP_MCP · Admin Control Center</title>
<style>
:root{color-scheme:dark;--bg:#0b1015;--side:#0e141a;--panel:#141b22;--panel2:#10171d;--line:#27323c;--text:#edf3f6;--muted:#8c99a4;--teal:#68dec3;--green:#7be0b9;--amber:#efbd6f;--red:#ef8787;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{position:sticky;top:0;height:100vh;padding:20px 13px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:10px;align-items:center;padding:0 8px}.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,#9bf0dc,#3fa88f);display:grid;place-items:center;color:#08231d;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#a3afb8;text-align:left;padding:10px 11px;border-radius:8px;cursor:pointer}.nav button:hover{background:#192229;color:#fff}.nav button.active{background:#1d3530;color:#a0efdf}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px;color:var(--muted);font-size:11px}.main{min-width:0}.top{height:64px;position:sticky;top:0;z-index:3;background:#0e1419ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:#b8c3c9;font-size:11px}.content{padding:27px 30px 50px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:17px}.head h1{margin:0 0 5px;font-size:26px;letter-spacing:-.03em}.head p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #35424c;background:#1a232a;color:#e6ecef;padding:8px 11px;border-radius:8px;font-weight:650;font-size:12px;cursor:pointer}.btn.primary{background:var(--teal);color:#08231d;border-color:var(--teal)}.btn.danger{background:#2a1d20;color:#f1b0b2;border-color:#553739}.btn:disabled{opacity:.4}.banner{border:1px solid #304a57;background:#15222a;color:#a9cad8;border-radius:10px;padding:12px 14px;margin-bottom:14px}.banner.warn{border-color:#554329;background:#241f17;color:#dcc18d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.metric,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.metric{padding:14px}.metric label{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:25px;margin-top:6px}.card{overflow:hidden}.cardhead{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}.cardhead h2{font-size:13px;margin:0}.cardhead small{color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{padding:10px 14px;background:#172028;color:#788792;text-transform:uppercase;letter-spacing:.08em;font-size:9px;text-align:left}td{padding:11px 14px;border-top:1px solid #222c34;font-size:12px}tbody tr:hover td{background:#182129}.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:10px;margin:1px;color:#c0cbd1}.tag.ok{background:#1d332d;color:#9de7d6}.tag.warn{background:#362c1e;color:#efc575}.tag.deny{background:#382125;color:#efa3a6}.empty{padding:42px;text-align:center;color:var(--muted)}.loading{padding:42px;text-align:center;color:var(--muted)}.modalback{position:fixed;inset:0;background:#030608cc;display:grid;place-items:center;padding:16px;z-index:10}.modal{width:min(650px,96vw);max-height:92vh;overflow:auto;background:#131a20;border:1px solid #37454f;border-radius:14px}.modalh,.modalf{padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.modalh{border-bottom:1px solid var(--line)}.modalf{border-top:1px solid var(--line);justify-content:flex-end;gap:8px}.form{padding:17px 18px;display:grid;gap:11px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:#b7c2c8;font-size:11px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#0e151a;border:1px solid #35424c;color:var(--text);border-radius:7px;padding:8px 9px}.field small{display:block;color:#75838d;font-size:10px;margin-top:4px}.toast{position:fixed;right:20px;bottom:20px;background:#213a34;border:1px solid #3b7868;color:#c0f2e6;padding:10px 13px;border-radius:9px;z-index:20}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}.error{color:#f2a4a7}.muted{color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:72px 1fr}.brand div:last-child,.nav button span{display:none}.nav button{text-align:center}.content{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.head{flex-direction:column}.row2{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.top{padding:0 12px}}
</style>
<script src="/admin/static/admin.js" defer></script>
</head>
<body>
<div id="root"><div class="loading">Loading Admin Control Center…</div></div>
<div id="overlay"></div><div id="toast"></div>

<style>
:focus-visible{outline:3px solid #9bf0dc;outline-offset:3px}.form-error{white-space:pre-wrap}.sr-status{padding:10px}.workflow-help{color:#dcc18d}.nav button{min-height:44px}.field label{cursor:pointer}dialog{color:inherit}.modal h2{font-size:18px}textarea{min-height:90px}
@media(max-width:900px){.nav button span{display:inline}.app{grid-template-columns:1fr}.side{position:static;height:auto}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.sidefoot{display:none}.brand div:last-child{display:block}}
</style>

</body>
</html>
