[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-mcp"
version = "0.1.0"
description = "Production-grade Business AI MCP gateway, 1C-first"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "defusedxml>=0.7,<1",
  "httpx>=0.28,<1",
  "mcp[cli]>=2,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "redis>=5.2,<7",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
gcp = ["google-cloud-secret-manager>=2.21,<3"]
dev = [
  "bandit>=1.8,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
business_ai_gateway = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
markers = [
  "integration: tests that require a real external 1C test instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["business_ai_gateway", "testbed"]
