services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: business_ai
      POSTGRES_USER: business_ai
      POSTGRES_PASSWORD: business_ai
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
